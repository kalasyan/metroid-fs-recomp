name: build

on:
  push:
    branches: [main]
    # Pushing a v* tag (or running the workflow by hand with a release tag)
    # creates the release, a pre-release if the tag has a suffix such as
    # v1.0-beta, and attaches the files.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create from this commit and attach the files to (e.g. v1.0); empty to only build
        required: false
        default: ''
  # Publishing a release from the GitHub page also attaches the files to it.
  release:
    types: [published]

jobs:
  linux:
    name: Linux (headless smoke test, ${{ matrix.region }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        region: [us, eu]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        # clang, like the Android NDK: it rejects implicit declarations, GCC does not.
        run: cmake -B build -G Ninja -DMF_HOST=headless -DMF_REGION=${{ matrix.region }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Smoke test (no game data)
        # The game can't run without the player's ROM, so CI only checks that
        # the engine starts and refuses a file that isn't Metroid Fusion.
        run: |
          head -c 8388608 /dev/zero > zero.gba
          if ./build/mf_headless --rom zero.gba --frames 10 --dump-every 0 > out.txt 2>&1; then
            cat out.txt; echo "a zero-filled ROM was accepted"; exit 1
          fi
          cat out.txt
          grep -q "ROM rejected" out.txt
      - name: Frame pacing test
        run: ./build/mf_pacing_test

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Set up the release keystore
        # Optional: without these secrets the APKs are signed with the
        # runner's throwaway debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = release ] || [ "${{ github.ref_type }}" = tag ] || [ -n "${{ inputs.release }}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release APKs are signed with a debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log
      - name: Show the signing certificate
        # Release APKs must keep the same certificate so updates install
        # over older versions.
        run: |
          # APK signature scheme v2 only (minSdk 24): keytool can't read it.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in android/app/build/outputs/apk/*/release/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -E "DN:|SHA-256"
          done
      - name: Report build errors
        if: failure()
        working-directory: android
        # Surface the end of the log as an annotation (readable from the API).
        run: |
          {
            grep -nE "error|Error|FAILED|What went wrong" gradle.log | tail -40
            echo "----- tail -----"
            tail -60 gradle.log
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build log::${msg}"
      - uses: actions/upload-artifact@v6
        with:
          name: mf-android-apk
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  release:
    name: Attach to the release
    # Only the files built above: APKs, never game data.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # A release made on the page with a new tag can also fire the tag push.
    concurrency: release-${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes $pre
          fi
          mkdir dist
          # app-eu-release.apk -> Metroid_Fusion-eu.apk
          # With a single artifact, download-artifact extracts it straight into
          # artifacts/ (no folder named after it), so search the whole tree.
          for apk in $(find artifacts -path '*/release/*.apk'); do
            region=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/Metroid_Fusion-$region.apk"
          done
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
